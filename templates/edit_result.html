{% extends 'base.html' %}
{% block pageheading %}Edit Result{% endblock %}

{% block main %}

<h2>Modify Data for {{ result_id[2] }} {{ result_id[3] }}</h2>
<p>Event: {{ data[2] }}m {{ result_id[4] }}</p>

<form method="POST" class="myform">
    <div class="form-group">
        <label class="form-label">Update Time</label>
        <input type="text" name="time" value="{{ data[0] }}" required>
    </div>
    <div class="form-group">
        <label class="form-label">Update Placing</label>
        <input type="number" name="placing" value="{{ data[1] }}" required>
    </div>
    <input type="submit" value="Save Changes">
    <p><a href="{{ url_for('render_modify_times_page') }}">Cancel and Go Back</a></p>
</form>

{% endblock %}
