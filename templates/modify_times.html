{% extends 'base.html' %}
{% block pageheading %}Modify Times{% endblock %}

{% block main %}

<table class="booking-table">
    <thead>
        <tr>
            <th>Swimmer</th>
            <th>Event</th>
            <th>Time</th>
            <th>Placing</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for r in results %}
        <tr>
            <td>{{ r[1] }} {{ r[2] }}</td>
            <td>{{ r[4] }}m {{ r[3] }}</td>
            <td>{{ r[5] }}</td>
            <td>{{ r[6] }}</td>
            <td>
                <a href="{{ url_for('edit_result', result_id=r[0]) }}" style="color: var(--pool-cyan); text-decoration: none; margin-right: 10px;">Edit</a>
                
                <a href="{{ url_for('delete_result', result_id=r[0]) }}" style="color: red; text-decoration: none;" onclick="return confirm('Delete this record permanently?')">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
